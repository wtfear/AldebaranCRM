services:
  - type: web
    name: aldebaran-crm
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: AldebaranCRM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: aldebaran-crm
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: aldebaran-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aldebaran-crm-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: aldebaran-crm-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aldebaran-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aldebaran-crm-db
          property: password

databases:
  - name: aldebaran-crm-db
    plan: free
    databaseName: aldebaran_crm
    user: aldebaran_admin
