services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aldebaran_crm_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "AldebaranCRM"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: aldebaran_crm
      DB_USERNAME: aldebaran_user
      DB_PASSWORD: aldebaran_secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor

  db:
    image: mysql:8.0
    container_name: aldebaran_crm_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: aldebaran_crm
      MYSQL_USER: aldebaran_user
      MYSQL_PASSWORD: aldebaran_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      timeout: 5s
      retries: 10
      interval: 5s

volumes:
  db_data:
    driver: local
